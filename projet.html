<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Projets — DevSym</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <img src="images/logo devsym.png" alt="DevSym logo" class="logo-img" />
                    <span class="brand-text">Coopérative <br>DevSym</span></span>
                </a>
            </div>
            <button class="nav-toggle" aria-expanded="false" aria-controls="primary-navigation"
                aria-label="Ouvrir le menu">
                <span class="hamburger" aria-hidden="true"></span>
            </button>
            <nav id="primary-navigation" class="nav">
                <a href="index.html">Accueil</a>
                <a href="about.html">À propos</a>
                <a href="services.html">Services</a>
                <a href="media.html">Médias</a>
                <a href="projet.html" class="active">Projets</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="contact.html" class="btn">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="missions" class="section">
            <div class="container">
                <div class="projects-controls" role="toolbar" aria-label="Filtres projets">
                    <div class="filters">
                        <label>Type
                            <select id="filter-type">
                                <option value="">Tous</option>
                                <option value="formation">Formation</option>
                                <option value="audit">Audit</option>
                                <option value="accompagnement">Accompagnement</option>
                            </select>
                        </label>
                        <label>Année
                            <select id="filter-year">
                                <option value="">Toutes</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                            </select>
                        </label>
                    </div>
                    <div class="actions">
                        <button id="reset-filters" class="btn btn-light">Réinitialiser</button>
                    </div>
                </div>

                <h2>Missions réalisées</h2>
                <p class="lead">Sélection de missions où nous avons accompagné des organisations. Cliquez sur une carte
                    pour en savoir plus.</p>

                <div class="missions-grid" id="missions-container">
                    <!-- Projects will be loaded here -->
                </div>

                <div class="load-more-wrap" style="text-align:center; margin-top:1rem;">
                    <button id="load-more" class="btn">Charger plus</button>
                </div>
            </div>
        </section>
        <section class="partners-section">
            <div class="container">
                <h2>Nos parténaires de développement</h2>
                <!-- <p class="lead">
                    Nous collaborons avec des partenaires institutionnels, associatifs et privés.
                </p> -->

                <div class="partners-grid" id="partners-container">
                    <!-- Les partenaires seront injectés ici dynamiquement -->
                </div>
            </div>
        </section>

        <!-- Project modal (lightbox) -->
        <div id="project-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
            <div class="modal-dialog">
                <button class="modal-close" aria-label="Fermer">×</button>
                <div class="modal-content">
                    <h3 id="modal-title"></h3>
                    <p id="modal-lead" class="muted"></p>
                    <div id="modal-gallery" class="modal-gallery"></div>
                    <div id="modal-body" class="modal-body"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Coopérative DevSym – Tous droits réservés</p>
    </footer>
    <script src="main.js" defer></script>
    <script src="social-feeds.js" defer></script>
    <script src="projet.js" defer></script>
</body>

</html>
