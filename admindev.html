<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Administration Services — DevSym</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Additional styles for admin page */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .services-list {
            margin-bottom: 40px;
        }

        .service-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .service-item h3 {
            margin: 0 0 5px 0;
        }

        .service-item p {
            margin: 5px 0;
        }

        .service-actions {
            margin-top: 10px;
        }

        .btn {
            padding: 8px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .form-section {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group textarea {
            height: 100px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #007bff;
            border-bottom-color: #007bff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <img src="images/logo devsym.png" alt="DevSym logo" class="logo-img" />
                    <span class="brand-text">DevSym</span>
                </a>
            </div>
            <nav id="primary-navigation" class="nav">
                <a href="index.html">Accueil</a>
                <a href="services.html">Services</a>
                <a href="admindev.html" class="active">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="admin-container">
            <h1>Panneau d'Administration</h1>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="services-tab">Services</button>
                <button class="tab-btn" data-tab="projets-tab">Projets</button>
                <button class="tab-btn" data-tab="portfolio-tab">Portfolio</button>
            </div>

            <!-- Services Tab -->
            <div id="services-tab" class="tab-content active">
                <!-- Services List -->
                <section class="services-list">
                    <h2>Liste des Services</h2>
                    <div id="services-container">
                        <!-- Services will be loaded here -->
                    </div>
                </section>

                <!-- Add/Edit Form -->
                <section class="form-section">
                    <h2 id="service-form-title">Ajouter un Nouveau Service</h2>
                    <form id="service-form">
                        <input type="hidden" id="service-id" value="">
                        <div class="form-group">
                            <label for="service-title">Titre</label>
                            <input type="text" id="service-title" required>
                        </div>
                        <div class="form-group">
                            <label for="service-lead">Lead</label>
                            <input type="text" id="service-lead" required>
                        </div>
                        <div class="form-group">
                            <label for="service-description">Description</label>
                            <textarea id="service-description" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submit-btn">Ajouter</button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Annuler</button>
                    </form>
                </section>
            </div>

            <!-- Projects Tab -->
            <div id="projets-tab" class="tab-content">
                <!-- Projects List -->
                <section class="projets-list">
                    <h2>Liste des Projets</h2>
                    <div id="projets-container">
                        <!-- Projects will be loaded here -->
                    </div>
                </section>

                <!-- Add/Edit Form -->
                <section class="form-section">
                    <h2 id="projet-form-title">Ajouter un Nouveau Projet</h2>
                    <form id="projet-form">
                        <input type="hidden" id="projet-id" value="">
                        <div class="form-group">
                            <label for="projet-title">Titre</label>
                            <input type="text" id="projet-title" required>
                        </div>
                        <div class="form-group">
                            <label for="projet-lead">Lead</label>
                            <input type="text" id="projet-lead" required>
                        </div>
                        <div class="form-group">
                            <label for="projet-type">Type</label>
                            <select id="projet-type" required>
                                <option value="">Sélectionner un type</option>
                                <option value="formation">Formation</option>
                                <option value="audit">Audit</option>
                                <option value="accompagnement">Accompagnement</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="projet-year">Année</label>
                            <select id="projet-year" required>
                                <option value="">Sélectionner une année</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="projet-description">Description</label>
                            <textarea id="projet-description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="projet-context">Contexte</label>
                            <input type="text" id="projet-context" placeholder="ex: Collectivité • 2024" required>
                        </div>
                        <div class="form-group">
                            <label for="projet-image">Image (URL)</label>
                            <input type="text" id="projet-image" placeholder="ex: images/project1.jpg" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="projet-submit-btn">Ajouter</button>
                        <button type="button" class="btn btn-secondary" id="projet-cancel-btn">Annuler</button>
                    </form>
                </section>
            </div>

            <!-- Portfolio Tab -->
            <div id="portfolio-tab" class="tab-content">
                <section class="projets-list">
                    <h2>Liste du Portfolio</h2>
                    <div id="portfolio-container">
                        <!-- Portfolio items will be loaded here -->
                    </div>
                </section>

                <section class="form-section">
                    <h2 id="portfolio-form-title">Ajouter un Nouvel Article</h2>
                    <form id="portfolio-form">
                        <input type="hidden" id="portfolio-id" value="">
                        <div class="form-group">
                            <label for="portfolio-title">Titre</label>
                            <input type="text" id="portfolio-title" required>
                        </div>
                        <div class="form-group">
                            <label for="portfolio-lead">Lead</label>
                            <input type="text" id="portfolio-lead">
                        </div>
                        <div class="form-group">
                            <label for="portfolio-type">Type</label>
                            <input type="text" id="portfolio-type" placeholder="ex: formation, assistance, appui" required>
                        </div>
                        <div class="form-group">
                            <label for="portfolio-year">Année</label>
                            <input type="text" id="portfolio-year" placeholder="ex: 2024" required>
                        </div>
                        <div class="form-group">
                            <label for="portfolio-summary">Résumé</label>
                            <input type="text" id="portfolio-summary" required>
                        </div>
                        <div class="form-group">
                            <label for="portfolio-description">Description</label>
                            <textarea id="portfolio-description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="portfolio-image">Image (URL)</label>
                            <input type="text" id="portfolio-image" placeholder="ex: images/project1.jpg" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="portfolio-submit-btn">Ajouter</button>
                        <button type="button" class="btn btn-secondary" id="portfolio-cancel-btn">Annuler</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Coopérative DevSym – Tous droits réservés</p>
    </footer>

    <script src="admindev.js" defer></script>
</body>

</html>
